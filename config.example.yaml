# 复制为 config.yaml 后在 Windows 上运行

poll_interval_ms: 100

log_every_tick: true
price_range: [10000, 99999]

# OCR — 你已安装 EasyOCR 时用 easyocr
ocr:
  engine: easyocr       # easyocr | windows | auto | tesseract
  tesseract_cmd: ""

# 软件 A：模拟客户端 / 行情交易系统
# 自绘界面读不到控件时，改 read_mode: region 并运行 calibrate_regions.py
software_a:
  window_title: "行情交易系统"
  read_mode: region          # auto | ui | region
  regions:
    bid: [0, 0, 0, 0]        # calibrate_regions.py 会自动填写 [x,y,w,h]
    ask: [0, 0, 0, 0]
    last: [0, 0, 0, 0]
  labels:
    bid: "买入"
    ask: "卖出"
    last: ""

software_b:
  window_title: "同花顺"
  read_mode: region
  regions:
    bid: [0, 0, 0, 0]
    ask: [0, 0, 0, 0]
    last: [0, 0, 0, 0]
  labels:
    bid: "买价"
    ask: "卖价"
    last: ""

compare:
  mode: executable

# 阈值与下单（改这里即可，不必改代码）
trade:
  alert_spread: 5.0      # |价差| >= 此值告警
  order_spread: 5.0      # |价差| >= 此值才考虑下单
  auto_order: false      # true 才允许走下单模块
  dry_run: true          # true=只写 logs/orders.log，不点鼠标
  lots: 1
  cooldown_ms: 5000
  software: software_a   # 默认在模拟客户端下单
  clicks:                # python calibrate_order.py 填写 [x, y]
    buy: [0, 0]
    sell: [0, 0]
    confirm: [0, 0]

alert:
  tick_size: 0.25
  confirm_reads: 2
  cooldown_ms: 2000
  sound: true
  log_csv: spreads.csv
  log_txt: spreads.log

webhook:
  enabled: false
  url: "http://192.168.1.x:8080/alert"
