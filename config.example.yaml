# 复制为 config.yaml 后在 Windows 上运行

poll_interval_ms: 100

log_every_tick: true
price_range: [10000, 99999]

# OCR — 你已安装 EasyOCR 时用 easyocr
ocr:
  engine: easyocr       # easyocr | windows | auto | tesseract
  tesseract_cmd: ""

# 软件 A：模拟客户端 / 行情交易系统
# 自绘界面读不到控件时，改 read_mode: region 并运行 calibrate_regions.py
software_a:
  window_title: "行情交易系统"
  read_mode: region          # auto | ui | region
  regions:
    bid: [0, 0, 0, 0]        # calibrate_regions.py 会自动填写 [x,y,w,h]
    ask: [0, 0, 0, 0]
    last: [0, 0, 0, 0]
  labels:
    bid: "买入"
    ask: "卖出"
    last: ""

software_b:
  window_title: "同花顺"
  read_mode: region
  regions:
    bid: [0, 0, 0, 0]
    ask: [0, 0, 0, 0]
    last: [0, 0, 0, 0]
  labels:
    bid: "买价"
    ask: "卖价"
    last: ""

compare:
  mode: executable

# 阈值与下单（同花顺领先 → 在模拟客户端跟单）
# lead = 同花顺最新价 - 模拟客户端最新价
trade:
  alert_spread: 5.0          # |lead| >= 此值告警
  open_long_spread: 5.0      # lead >= 此值 → 开多
  open_short_spread: -5.0    # lead <= 此值 → 开空
  leader: software_b         # 同花顺
  order_on: software_a       # 在模拟客户端下单
  auto_order: false
  dry_run: true
  lots: 1
  cooldown_ms: 5000
  clicks:                    # python calibrate_order.py
    buy: [0, 0]              # 开多
    sell: [0, 0]             # 开空
    confirm: [0, 0]

alert:
  tick_size: 0.25
  confirm_reads: 2
  cooldown_ms: 2000
  sound: true
  log_csv: spreads.csv
  log_txt: spreads.log

webhook:
  enabled: false
  url: "http://192.168.1.x:8080/alert"
